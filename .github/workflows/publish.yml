name: publish
on:
  schedule:
    # Keep-alive only. GitHub fires this every few hours at best; its job is to
    # restart the waiter chain if it ever breaks, not to hit slots on time.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      wait_until:
        description: "ISO time to publish at (long waits are relayed to a fresh run)"
        required: false
        default: ""
permissions:
  contents: read
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      WAIT_UNTIL: ${{ inputs.wait_until }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: keep-alive (scheduled runs only)
        id: keep
        if: ${{ github.event_name == 'schedule' }}
        run: |
          waiting=$(gh run list -R "$GITHUB_REPOSITORY" -w publish -e workflow_dispatch -s in_progress --json databaseId -q 'length')
          queued=$(gh run list -R "$GITHUB_REPOSITORY" -w publish -e workflow_dispatch -s queued --json databaseId -q 'length')
          echo "waiters in progress: $waiting, queued: $queued"
          if [ "$waiting" = "0" ] && [ "$queued" = "0" ]; then
            next=$(node next.mjs)
            if [ -n "$next" ]; then echo "chain was down, starting a waiter for $next"; gh workflow run publish -R "$GITHUB_REPOSITORY" -f wait_until="$next"; fi
          fi
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: wait for the slot (or relay a long wait)
        id: wait
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.wait_until != '' }}
        run: |
          target=$(date -d "$WAIT_UNTIL" +%s); now=$(date +%s); secs=$(( target - now ))
          max=$(( 340 * 60 ))
          if [ "$secs" -gt "$max" ]; then
            echo "slot is ${secs}s away; sleeping ${max}s then relaying"
            sleep "$max"
            gh workflow run publish -R "$GITHUB_REPOSITORY" -f wait_until="$WAIT_UNTIL"
            echo "relayed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "sleeping ${secs}s until $WAIT_UNTIL"
          if [ "$secs" -gt 0 ]; then sleep "$secs"; fi
          git pull -q

      - name: publish
        if: ${{ github.event_name == 'workflow_dispatch' && steps.wait.outputs.relayed != 'true' }}
        run: node publish.mjs

      - name: chain to the next post
        if: ${{ github.event_name == 'workflow_dispatch' && steps.wait.outputs.relayed != 'true' && always() }}
        run: |
          git pull -q
          next=$(node next.mjs)
          if [ -n "$next" ]; then echo "next wake $next"; gh workflow run publish -R "$GITHUB_REPOSITORY" -f wait_until="$next";
          else echo "queue empty; the keep-alive restarts the chain when new posts arrive"; fi
