name: publish
on:
  schedule:
    # every 15 min, 06:00-21:59 UTC (07:00-22:59 London in summer time).
    # GitHub's scheduler is best effort: on 28-29 Sept it ran hours late or not
    # at all, so important posts use the wait_until dispatch below instead.
    - cron: "*/15 6-21 * * *"
  workflow_dispatch:
    inputs:
      wait_until:
        description: "ISO time to sleep until before publishing (max ~5h50m ahead)"
        required: false
        default: ""
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: wait for the slot
        if: ${{ inputs.wait_until != '' }}
        run: |
          target=$(date -d "${{ inputs.wait_until }}" +%s); now=$(date +%s)
          secs=$(( target - now )); echo "sleeping ${secs}s until ${{ inputs.wait_until }}"
          if [ "$secs" -gt 0 ]; then sleep "$secs"; fi
          git pull -q   # pick up any schedule change made while waiting
      - run: node publish.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
